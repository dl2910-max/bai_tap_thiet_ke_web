<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang cá nhân</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            margin: 0;
        }

        .container {
            width: 600px;
            max-width: 90%;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 10px #ccc;
        }

        h1 {
            color: #2563eb;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
        }

        .info {
            text-align: left;
            margin-top: 20px;
        }

        footer {
            margin-top: 30px;
            color: gray;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>TRANG CÁ NHÂN</h1>

        <h2>Nguyễn Văn A</h2>

        <div class="info">
            <p><b>Họ tên:</b> Nguyễn Văn A</p>
            <p><b>MSSV:</b> 123456789</p>
            <p><b>Lớp:</b> CNTT01</p>
            <p><b>Ngành:</b> Công nghệ thông tin</p>
            <p><b>Sở thích:</b> Lập trình, nghe nhạc, chơi game</p>
        </div>

        <footer>
            Website được xây dựng bằng HTML và CSS
        </footer>

    </div>

</body>
</html>
